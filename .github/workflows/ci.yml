name: CI (Quality & Tests)

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**', '!main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Verify Curriculum Integrity
        run: npm run verify:curriculum

      - name: Verify Production Build
        run: npm run build
